[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mansour-core-api"
version = "0.1.0"
description = "MANSOUR Vision control plane: identity, authorization, configuration, audit. Never sees a video frame."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "mansour-common",
    "mansour-contracts",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mansour_api = ["py.typed"]
