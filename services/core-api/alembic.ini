# Alembic configuration for the MANSOUR Vision schema.
#
# The database URL is NOT set here. It is built at runtime from `PostgresSettings`
# in `alembic/env.py`, so the password comes from the Docker secret and never
# lands in a file that could be committed.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

# Migrations are named `NNNN_slug.py`, ordered and greppable. A bare hash tells
# a reviewer nothing about what a migration does or when it landed.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 48

# Fail rather than guess when a migration is applied to an unexpected revision.
revision_environment = false

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
