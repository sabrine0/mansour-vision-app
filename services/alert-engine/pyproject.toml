[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mansour-alert-engine"
version = "0.1.0"
description = "Rule evaluation, cooldowns, contextual arming, clustering, escalation and assignment."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "mansour-common",
    "mansour-contracts",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
mansour-alert-engine = "mansour_alert_engine.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mansour_alert_engine = ["py.typed"]
