[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mansour-analytics-consumer"
version = "0.1.0"
description = "Time-series aggregation, occupancy reconciliation, dwell time by Little's Law, heatmaps."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "mansour-common",
    "mansour-contracts",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
mansour-analytics-consumer = "mansour_analytics.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mansour_analytics = ["py.typed"]
