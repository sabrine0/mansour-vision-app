upstream core_api {
    server core-api:8000;
    keepalive 32;
}

upstream dashboard {
    server dashboard:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # TLS terminates here in production. The certificate is mounted, never baked
    # into the image, and HTTP redirects to HTTPS. Deferred until the deployment
    # host and its certificate authority are known.
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/tls/fullchain.pem;
    # ssl_certificate_key /etc/nginx/tls/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    limit_conn conn 64;

    # NGINX's own liveness. Never proxied, never logged.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Orchestrator probes must never reach the public edge.
    location ~ ^/(healthz|readyz)$ {
        deny all;
        return 404;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;

        proxy_pass         http://core_api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Generate a correlation id at the edge when the caller supplies none,
        # so every request in the platform has one from its first hop.
        proxy_set_header   X-Request-ID      $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Authentication endpoints. Stricter budget, no burst.
    location = /api/auth/login {
        limit_req zone=login burst=3 nodelay;

        proxy_pass       http://core_api/auth/login;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # Live telemetry to the operator console. Long-lived; the read timeout must
    # exceed the heartbeat interval or the socket is torn down every 60 seconds.
    location /api/ws {
        proxy_pass         http://core_api/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    location / {
        proxy_pass         http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
