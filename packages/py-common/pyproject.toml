[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mansour-common"
version = "0.1.0"
description = "Cross-cutting infrastructure shared by every MANSOUR Vision Python service."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4,<26",
    "starlette>=0.41,<1",
    "uvicorn>=0.32,<1",
    "redis>=5.2,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mansour_common = ["py.typed"]
